services:
  - type: web
    name: voyage-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python backend/manage.py migrate --noinput"
    startCommand: "cd backend && gunicorn nothing_game.wsgi:application"
    healthCheckPath: "/api/leaderboard/"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
